name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      APP_NAME: "IdentityForge"
      APP_VERSION: "1.0.0"
      NODE_ENV: "test"
      PORT: 5000
      FRONTEND_URL: "http://localhost:3000"
      DATABASE_URL: "postgres://root:rootpassword@localhost:5432/identityforge?schema=public"
      JWT_ACCESS_SECRET: "your_super_secret_access_key_min_32_characters"
      JWT_REFRESH_SECRET: "your_super_secret_refresh_key_min_32_characters"
      JWT_ACCESS_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      SMTP_NAME: "IdentityForge Mailer"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "test@gmail.com"
      SMTP_PASS: "password"
      MAX_FAILED_LOGIN: 5
      ACCOUNT_LOCK_DURATION: 15
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Install Dependencies
        run: npm install

      - name: Typecheck and Build
        run: npm run build

      - name: Run Test Suite
        run: npm run test:run
