services:
  # -------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: if_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: identityforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d identityforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Redis (Cache, Queues, Rate Limiting)
  # -------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: if_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------
  # Backend API
  # -------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: if_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://root:rootpassword@db:5432/identityforge?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------
  # Prometheus (Metrics Scraper)
  # -------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: if_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # -------------------------------------------------
  # Grafana (Visualization Dashboard)
  # -------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: if_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  grafana-data: